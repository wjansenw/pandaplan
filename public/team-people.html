<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pandaplan · People</title><link rel="stylesheet" href="/style.css"></head><body><div class="nav"><a class="brand" id="brand">🐼 pandaplan</a><div class="links"><a id="events">Events</a><a class="current" id="people">People</a><a id="categories">Categories</a><a href="/teams.html">Teams</a></div></div><div class="wrap"><h1 id="title">People</h1><p class="sub">People in this Team and their Team-specific roles.</p><div class="card"><div id="list"></div><div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Roles</label><div id="roles" class="chip-row"></div></div><button class="btn" id="add">Add person</button><div id="note" class="saved-note"></div></div></div><script src="/shared.js"></script><script>const slug=decodeURIComponent(location.pathname.split('/')[2]||'');const roleOpts=[{id:'participant',label:'Participant'},...STAFF_ROLES];let selected=new Set(['participant']);function nav(){const b='/team/'+encodeURIComponent(slug);brand.href=b+'/events';events.href=b+'/events';people.href=b+'/people';categories.href=b+'/categories'}function renderRoles(){renderMultiSelectChips(roleOpts,selected,renderRoles,document.getElementById('roles'))}function renderMultiSelectChips(opts,set,cb,box){box.innerHTML='';opts.forEach(o=>{const x=document.createElement('button');x.type='button';x.className='chip'+(set.has(o.id)?' active':'');x.textContent=o.label;x.onclick=()=>{set.has(o.id)?set.delete(o.id):set.add(o.id);cb()};box.appendChild(x)})}async function load(){nav();const team=await api('/api/teams/'+encodeURIComponent(slug));title.textContent=team.name+' · People';list.innerHTML=(team.members||[]).map(p=>'<div class="person-admin-item"><div class="person-head"><strong>'+escapeHtml(p.name)+'</strong><button class="del" data-remove="'+escapeHtml(p.id)+'">Remove</button></div><div class="chip-row" data-id="'+escapeHtml(p.id)+'"></div></div>').join('');(team.members||[]).forEach(p=>{const box=list.querySelector('[data-id="'+CSS.escape(p.id)+'"]');const set=new Set(p.roles);renderMultiSelectChips(roleOpts,set,async()=>{if(!set.size){alert('A person must have at least one role.');return}await api('/api/teams/'+encodeURIComponent(slug)+'/members/'+encodeURIComponent(p.id)+'/roles',{method:'PUT',body:JSON.stringify({roles:[...set]})});load()},box)});list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(confirm('Remove this person from the Team?')){await api('/api/teams/'+encodeURIComponent(slug)+'/members/'+encodeURIComponent(b.dataset.remove),{method:'DELETE'});load()}})}add.onclick=async()=>{const nameEl=document.getElementById('name');if(!nameEl.value.trim()||!selected.size){note.textContent='Name and at least one role are required.';return}try{await api('/api/teams/'+encodeURIComponent(slug)+'/persons',{method:'POST',body:JSON.stringify({name:nameEl.value,roles:[...selected]})});nameEl.value='';selected=new Set(['participant']);renderRoles();load()}catch(e){note.textContent=e.message}};nav();renderRoles();load();</script></body></html>
