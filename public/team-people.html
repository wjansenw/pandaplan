<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pandaplan · People</title><link rel="stylesheet" href="/style.css"></head><body><div class="nav"><a class="brand" id="brand">🐼 pandaplan</a><div class="links"><a id="overview" data-i18n="overview">Overview</a><a class="current" id="people" data-admin-only data-i18n="peopleNav">People</a><a id="categories" data-admin-only data-i18n="categories">Categories</a><a id="events" data-admin-only data-i18n="events">Events</a></div></div><div class="wrap"><h1 id="title" data-i18n="peopleNav">People</h1><p class="sub" data-i18n="peopleSubtitle">People in this Team and their Team-specific roles.</p><div class="card"><div id="list"></div><div class="field"><label data-i18n="name">Name</label><input id="name"></div><div class="field"><label data-i18n="rolesLabel">Roles</label><div id="roles" class="chip-row"></div></div><button class="btn" id="add" data-i18n="addPerson">Add person</button><div id="note" class="saved-note"></div></div></div><script src="/shared.js"></script><script>const slug=decodeURIComponent(location.pathname.split('/')[2]||'');const roleOpts=[{id:'participant',label:t('participant')},...STAFF_ROLES];let selected=new Set(['participant']);const adminMode=new URLSearchParams(location.search).get('mode')==='admin';function modeUrl(url){return adminMode?url+(url.includes('?')?'&':'?')+'mode=admin':url}function applyTranslations(){document.documentElement.lang=currentLanguage==='nl-BE'?'nl':'en';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n))}function nav(){const b='/team/'+encodeURIComponent(slug);brand.href=modeUrl(b+'/overview');overview.href=modeUrl(b+'/overview');people.href=modeUrl(b+'/people');categories.href=modeUrl(b+'/categories');events.href=modeUrl(b+'/events');document.querySelectorAll('[data-admin-only]').forEach(el=>el.hidden=!adminMode)}function renderRoles(){renderMultiSelectChips(roleOpts,selected,renderRoles,document.getElementById('roles'))}function renderMultiSelectChips(opts,set,cb,box){box.innerHTML='';opts.forEach(o=>{const x=document.createElement('button');x.type='button';x.className='chip'+(set.has(o.id)?' active':'');x.textContent=o.label;x.onclick=()=>{set.has(o.id)?set.delete(o.id):set.add(o.id);cb()};box.appendChild(x)})}async function load(){nav();applyTranslations();const team=await api('/api/teams/'+encodeURIComponent(slug));title.textContent=team.name+' · '+t('peopleNav');list.innerHTML=(team.members||[]).map(p=>'<div class="person-admin-item"><div class="person-head"><strong>'+escapeHtml(p.name)+'</strong><button class="del" data-remove="'+escapeHtml(p.id)+'">'+escapeHtml(t('remove'))+'</button></div><div class="chip-row" data-id="'+escapeHtml(p.id)+'"></div></div>').join('');(team.members||[]).forEach(p=>{const box=list.querySelector('[data-id="'+CSS.escape(p.id)+'"]');const set=new Set(p.roles);renderMultiSelectChips(roleOpts,set,async()=>{if(!set.size){alert(t('roleRequired'));return}await api('/api/teams/'+encodeURIComponent(slug)+'/members/'+encodeURIComponent(p.id)+'/roles',{method:'PUT',body:JSON.stringify({roles:[...set]})});load()},box)});list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(confirm(t('confirmRemovePersonFromTeam'))){await api('/api/teams/'+encodeURIComponent(slug)+'/members/'+encodeURIComponent(b.dataset.remove),{method:'DELETE'});load()}})}add.onclick=async()=>{const nameEl=document.getElementById('name');if(!nameEl.value.trim()||!selected.size){note.textContent=t('nameAndRoleRequired');return}try{await api('/api/teams/'+encodeURIComponent(slug)+'/persons',{method:'POST',body:JSON.stringify({name:nameEl.value,roles:[...selected]})});nameEl.value='';selected=new Set(['participant']);renderRoles();load()}catch(e){note.textContent=e.message}};nav();applyTranslations();renderRoles();load();</script></body></html>
