<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pandaplan · Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .roster-card{padding:18px 22px;}
  .roster-names{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .roster-name{
    font-size:13px;font-weight:600;color:var(--ink);
    background:var(--accent-bg);color:var(--accent);
    padding:5px 12px;border-radius:999px;
  }
  .roster-empty{font-size:13px;color:var(--ink-soft);font-style:italic;margin-top:10px;}
  .roster-note{font-weight:500;opacity:0.85;}
</style>
</head>
<body>
<div class="nav">
  <a class="brand" href="/">🐼 pandaplan</a>
  <div class="links">
    <a href="/">Attend</a>
    <a href="/admin.html">Admin</a>
    <a href="/trainer.html" class="current">Trainer</a>
    <a href="/staff.html">Staff</a>
  </div>
</div>

<div class="wrap">
  <h1>Who's coming?</h1>
  <p class="sub">Roster per event, based on everyone's pre-registrations.</p>

  <div class="card" id="subscribeCard"></div>

  <div class="card">
    <h3>Category</h3>
    <div class="chip-row" id="categoryFilter" style="margin-bottom:16px;"></div>
    <h3>Date</h3>
    <div class="chip-row" id="dateFilter"></div>
  </div>

  <div id="rosterSection"></div>
</div>

<script src="/shared.js"></script>
<script>
let persons = [];
let categories = [];
let events = [];
let attendanceByPerson = {}; // { personId: { eventId: { note } } }
let filters = { categoryIds: new Set(), dateMode: 'upcoming' };

async function loadAll() {
  const [state, attendanceRes] = await Promise.all([
    api('/api/state'),
    api('/api/attendance'),
  ]);
  persons = state.persons || [];
  categories = state.categories || [];
  events = state.events || [];
  attendanceByPerson = attendanceRes.attendance || {};

  renderFilters();
  renderRoster();
  const url = window.location.origin + '/calendar/all.ics';
  renderSubscribeBox(document.getElementById('subscribeCard'), url, 'Sync full schedule to calendar');
}

function renderFilters() {
  renderCategoryFilterChips(document.getElementById('categoryFilter'), categories, filters.categoryIds, () => {
    renderFilters();
    renderRoster();
  });
  renderDateFilterChips(document.getElementById('dateFilter'), filters.dateMode, (mode) => {
    filters.dateMode = mode;
    renderFilters();
    renderRoster();
  });
}

function attendeesFor(eventId) {
  const attendees = [];
  persons.forEach(p => {
    const entry = attendanceByPerson[p.id] && attendanceByPerson[p.id][eventId];
    if (entry) attendees.push({ name: p.name, note: (entry && entry.note) || '' });
  });
  return attendees;
}

function renderRoster() {
  const section = document.getElementById('rosterSection');
  section.innerHTML = '';

  if (!events.length) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<div class="empty">No events yet — add some in Admin first.</div>';
    section.appendChild(card);
    return;
  }

  const filtered = sortByDateTime(filterEvents(events, filters));

  if (!filtered.length) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<div class="empty">No events match the current filters.</div>';
    section.appendChild(card);
    return;
  }

  filtered.forEach(ev => {
    const attendees = attendeesFor(ev.id);
    const timeRange = formatTimeRange(ev.startTime, ev.endTime);
    const cat = categoryById(categories, ev.categoryId);
    const staffLabels = cat ? staffRoleLabels(cat.requiredStaffRoles) : [];
    const card = document.createElement('div');
    card.className = 'card roster-card';
    card.innerHTML = `
      <div class="card-head">
        <div>
          <div class="event-title-line">
            <span class="event-date">${formatDate(ev.date)}</span>
            ${categoryBadge(categories, ev.categoryId)}
            ${staffLabels.length ? `<span class="staff-badge">Staff needed: ${escapeHtml(staffLabels.join(', '))}</span>` : ''}
          </div>
          <div class="event-meta">${[timeRange, escapeHtml(ev.location)].filter(Boolean).join(' · ')}</div>
        </div>
        <span class="count">${attendees.length} attending</span>
      </div>
      ${ev.description ? `<div class="event-desc">${escapeHtml(ev.description)}</div>` : ''}
      ${attendees.length
        ? `<div class="roster-names">${attendees.map(a => `<span class="roster-name">${escapeHtml(a.name)}${a.note ? `<span class="roster-note"> · ${escapeHtml(a.note)}</span>` : ''}</span>`).join('')}</div>`
        : `<div class="roster-empty">No one has registered yet.</div>`}
    `;
    section.appendChild(card);
  });
}

loadAll();
</script>
</body>
</html>
