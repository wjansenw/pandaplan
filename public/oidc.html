<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PandaPlan</title>
</head>
<body>
  <main class="card">
    <h1 data-oidc-i18n="oidcTitle">PandaPlan authentication</h1>
    <div id="content"><span data-oidc-i18n="oidcChecking">Checking authentication…</span></div>
  </main>
  <script src="/shared.js"></script>
  <script src="/oidc-i18n.js"></script>
  <script>
    function renderSession(session) {
      const content = document.getElementById('content');
      document.documentElement.lang = oidcLanguage();
      document.title = oidcT('oidcTitle');
      if (!session.authenticated) {
        content.innerHTML = `<p>${escapeHtml(oidcT('oidcNotAuthenticated'))}</p><p><a class="button" href="/oidc/login">${escapeHtml(oidcT('oidcLogin'))}</a></p>`;
        return;
      }
      const user = session.user;
      content.innerHTML =
        `<p><strong>${escapeHtml(oidcT('oidcAuthenticated'))}</strong></p>` +
        '<dl>' +
        `<dt>${escapeHtml(oidcT('oidcName'))}</dt><dd>${escapeHtml(user.name)}</dd>` +
        `<dt>${escapeHtml(oidcT('oidcEmail'))}</dt><dd>${escapeHtml(user.email || oidcT('oidcNoEmail'))}</dd>` +
        `<dt>${escapeHtml(oidcT('oidcSubject'))}</dt><dd>${escapeHtml(user.sub)}</dd>` +
        `<dt>${escapeHtml(oidcT('oidcIssuer'))}</dt><dd>${escapeHtml(user.issuer || '')}</dd>` +
        '</dl>' +
        `<form method="post" action="/oidc/logout"><button class="button" type="submit">${escapeHtml(oidcT('oidcLogout'))}</button></form>`;
    }

    async function load() {
      try {
        const response = await fetch('/oidc/session', { credentials: 'same-origin' });
        renderSession(await response.json());
      } catch (error) {
        document.getElementById('content').innerHTML = `<p class="error">${escapeHtml(oidcT('oidcAuthError'))}</p>`;
        console.error(error);
      }
    }

    load();
  </script>
</body>
</html>
