<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pandaplan · Team overview</title><link rel="stylesheet" href="/style.css"></head><body><div class="nav"><a class="brand" id="brand">🐼 pandaplan</a><div class="links"><a class="current" id="overview">Overview</a><a id="attend">Attend</a><a id="staff">Staff</a><a id="people">People</a><a id="categories">Categories</a></div></div><div class="wrap"><div class="page-head"><div><h1 id="title">Team overview</h1><p class="sub">Attendance and staff assignments for this Team.</p></div><button id="editAttendance" type="button" class="btn secondary">Edit attendance</button></div><div class="card"><h2>Calendar</h2><p>Subscribe to this Team's events in your calendar app.</p><div class="subscribe-row"><input id="calendarUrl" type="text" readonly onclick="this.select()"><button id="copyCalendar" type="button" class="btn secondary">Copy</button></div><div class="subscribe-hint">Paste this link into your calendar app's "subscribe by URL" option to keep it in sync automatically.</div></div><div class="card"><div class="chip-row" id="dates"></div></div><div id="events"></div></div><script src="/shared.js"></script><script>const slug=decodeURIComponent(location.pathname.split('/')[2]||'');let state;let dateMode='upcoming';let editMode=false;function base(){return '/team/'+encodeURIComponent(slug)}function nav(){const b=base();brand.href=b+'/overview';overview.href=b+'/overview';attend.href=b+'/attend';staff.href=b+'/staff';people.href=b+'/people';categories.href=b+'/categories'}async function load(){nav();state=await api('/api/teams/'+encodeURIComponent(slug)+'/state');title.textContent=state.team.name+' · Overview';const url=location.origin+'/calendar/team/'+encodeURIComponent(slug)+'.ics';calendarUrl.value=url;copyCalendar.onclick=async()=>{try{await navigator.clipboard.writeText(url);copyCalendar.textContent='Copied!'}catch(e){calendarUrl.select();document.execCommand('copy');copyCalendar.textContent='Select & copy'}setTimeout(()=>copyCalendar.textContent='Copy',1500)};editAttendance.onclick=()=>{editMode=!editMode;editAttendance.textContent=editMode?'Done':'Edit attendance';render()};render()}function render(){renderDateFilterChips(document.getElementById('dates'),dateMode,m=>{dateMode=m;render()});const list=sortByDateTime(filterEvents(state.events,{categoryIds:new Set(),dateMode}));const box=document.getElementById('events');box.innerHTML='';if(!list.length){box.innerHTML='<div class="card"><div class="empty">No events match this filter.</div></div>';return}list.forEach(ev=>{const card=document.createElement('div');card.className='card roster-card';const participants=state.persons.filter(p=>p.roles.includes('participant'));const a=participants.map(p=>{const e=state.attendance[p.id]?.[ev.id];return {...p,status:e?.status||'unknown',note:e?.note||''}});const yes=a.filter(x=>x.status==='yes'),maybe=a.filter(x=>x.status==='maybe'),no=a.filter(x=>x.status==='no'),unknown=a.filter(x=>x.status==='unknown');const sa=state.staffAssignments[ev.id]||{};const staff=Object.entries(sa).flatMap(([r,ids])=>ids.map(id=>{const p=state.persons.find(x=>x.id===id);const role=STAFF_ROLES.find(x=>x.id===r);return p?{name:p.name,role:role?role.label:r}:null})).filter(Boolean);card.innerHTML='<div class="card-head"><div><div class="event-title-line"><span class="event-date">'+formatDate(ev.date)+'</span>'+categoryBadge(state.categories,ev.categoryId)+'</div><div class="event-meta">'+[formatTimeRange(ev.startTime,ev.endTime),ev.location?'<a href="'+formatMapsLink(ev.location)+'" target="_blank" class="location-link">'+escapeHtml(ev.location)+'</a>':''].filter(Boolean).join(' · ')+'</div></div></div>'+(ev.description?'<div class="event-desc">'+escapeHtml(ev.description)+'</div>':'')+(editMode?'<div class="attendance-edit">'+a.map(p=>'<button type="button" class="attendance-person attendance-'+p.status+'" data-person="'+escapeHtml(p.id)+'" data-event="'+escapeHtml(ev.id)+'"><span>'+escapeHtml(p.name)+'</span><small>'+statusLabel(p.status)+'</small></button>').join('')+'</div>':'<div class="attendance-summary">'+roster('Going',yes,'attendance-going')+roster('Maybe',maybe,'attendance-maybe')+roster('Not going',no,'attendance-not-going')+(unknown.length?roster('Unknown',unknown,'attendance-unknown'):'')+'</div>')+(staff.length?'<div class="staff-summary"><strong>Staff</strong><div class="roster-names">'+staff.map(s=>'<span class="staff-name">'+escapeHtml(s.role)+': '+escapeHtml(s.name)+'</span>').join('')+'</div></div>':'');box.appendChild(card)});if(editMode)box.querySelectorAll('.attendance-person').forEach(btn=>btn.onclick=()=>toggleAttendance(btn.dataset.person,btn.dataset.event))}async function toggleAttendance(personId,eventId){const current=state.attendance[personId]?.[eventId]?.status||'unknown';const next=current==='yes'?'maybe':current==='maybe'?'no':'yes';await api('/api/teams/'+encodeURIComponent(slug)+'/attendance/'+encodeURIComponent(personId)+'/'+encodeURIComponent(eventId),{method:'PUT',body:{status:next}});if(!state.attendance[personId])state.attendance[personId]={};state.attendance[personId][eventId]={status:next,note:''};render()}function statusLabel(status){return status==='yes'?'Going':status==='maybe'?'Maybe':status==='no'?'Not going':'Unknown'}function roster(label,people,cls){return '<div class="attendance-group '+cls+'"><strong>'+label+' ('+people.length+')</strong>'+(people.length?'<div class="roster-names">'+people.map(p=>'<span class="roster-name">'+escapeHtml(p.name)+(p.note?' <span class="roster-note">· '+escapeHtml(p.note)+'</span>':'')+'</span>').join('')+'</div>':'')+'</div>'}load();</script><style>.page-head{display:flex;justify-content:space-between;align-items:center;gap:16px}.attendance-summary{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.attendance-group{padding:5px 9px;border-radius:6px;font-size:.9rem;line-height:1.35}.attendance-group .roster-names{display:inline;margin-left:6px}.attendance-group .roster-name{display:inline}.attendance-going{background:#E7EFE3;color:#4F7942}.attendance-going .roster-name{color:#4F7942}.attendance-maybe{background:#FFF3CD;color:#856404}.attendance-maybe .roster-name{color:#856404}.attendance-not-going{background:#F5E6E2;color:#B5503F}.attendance-not-going .roster-name{color:#B5503F}.attendance-unknown{background:#eeeeee;color:#666}.attendance-unknown .roster-name{color:#666}.attendance-group strong{font-weight:600}.staff-summary{margin-top:12px;padding:8px 0;border-top:1px solid #eee}.staff-summary .roster-names{display:inline;margin-left:8px}.staff-name{font-size:13px;font-weight:600;color:var(--ink-soft);background:var(--paper-dim);padding:5px 12px;border-radius:999px;margin-right:6px}.attendance-edit{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.attendance-person{border:0;border-radius:999px;padding:7px 12px;cursor:pointer;font:inherit;display:inline-flex;align-items:center;gap:7px}.attendance-person small{font-size:.75em;opacity:.8}.attendance-person.attendance-unknown{background:#eee;color:#666}.attendance-person.attendance-yes{background:#E7EFE3;color:#4F7942}.attendance-person.attendance-maybe{background:#FFF3CD;color:#856404}.attendance-person.attendance-no{background:#F5E6E2;color:#B5503F}.attendance-person:hover{filter:brightness(.96)}</style></body></html>
