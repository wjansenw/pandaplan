<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pandaplan · Team overview</title><link rel="stylesheet" href="/style.css"></head><body><div class="nav"><a class="brand" id="brand">🐼 pandaplan</a><div class="links"><a class="current" id="overview">Overview</a><a id="attend">Attend</a><a id="staff">Staff</a><a id="people">People</a><a id="categories">Categories</a><a href="/teams.html">Teams</a></div></div><div class="wrap"><h1 id="title">Team overview</h1><p class="sub">Attendance and staff assignments for this Team.</p><div class="card"><h2>Calendar</h2><p>Subscribe to this Team's events in your calendar app.</p><div class="subscribe-row"><input id="calendarUrl" type="text" readonly onclick="this.select()"><button id="copyCalendar" type="button" class="btn secondary">Copy</button></div><div class="subscribe-hint">Paste this link into your calendar app's "subscribe by URL" option to keep it in sync automatically.</div></div><div class="card"><div class="chip-row" id="dates"></div></div><div id="events"></div></div><script src="/shared.js"></script><script>const slug=decodeURIComponent(location.pathname.split('/')[2]||'');let state;let dateMode='upcoming';function base(){return '/team/'+encodeURIComponent(slug)}function nav(){const b=base();brand.href=b+'/overview';overview.href=b+'/overview';attend.href=b+'/attend';staff.href=b+'/staff';people.href=b+'/people';categories.href=b+'/categories'}async function load(){nav();state=await api('/api/teams/'+encodeURIComponent(slug)+'/state');title.textContent=state.team.name+' · Overview';const url=location.origin+'/calendar/team/'+encodeURIComponent(slug)+'.ics';calendarUrl.value=url;copyCalendar.onclick=async()=>{try{await navigator.clipboard.writeText(url);copyCalendar.textContent='Copied!'}catch(e){calendarUrl.select();document.execCommand('copy');copyCalendar.textContent='Select & copy'}setTimeout(()=>copyCalendar.textContent='Copy',1500)};render()}function render(){renderDateFilterChips(document.getElementById('dates'),dateMode,m=>{dateMode=m;render()});const list=sortByDateTime(filterEvents(state.events,{categoryIds:new Set(),dateMode}));const box=document.getElementById('events');box.innerHTML='';if(!list.length){box.innerHTML='<div class="card"><div class="empty">No events match this filter.</div></div>';return}list.forEach(ev=>{const card=document.createElement('div');card.className='card roster-card';const a=state.persons.map(p=>{const e=state.attendance[p.id]?.[ev.id];return e?{...p,status:e.status,note:e.note||''}:null}).filter(Boolean);const yes=a.filter(x=>x.status==='yes'),maybe=a.filter(x=>x.status==='maybe'),no=a.filter(x=>x.status==='no');const sa=state.staffAssignments[ev.id]||{};const staff=Object.entries(sa).flatMap(([r,ids])=>ids.map(id=>{const p=state.persons.find(x=>x.id===id);const rl=STAFF_ROLES.find(x=>x.id===r)?.label||r;return p?'<span class="roster-name">'+escapeHtml(rl)+': '+escapeHtml(p.name)+'</span>':''})).join('');card.innerHTML='<div class="card-head"><div><div class="event-title-line"><span class="event-date">'+formatDate(ev.date)+'</span>'+categoryBadge(state.categories,ev.categoryId)+'</div><div class="event-meta">'+[formatTimeRange(ev.startTime,ev.endTime),ev.location?'<a href="'+formatMapsLink(ev.location)+'" target="_blank" class="location-link">'+escapeHtml(ev.location)+'</a>':''].filter(Boolean).join(' · ')+'</div></div></div>'+(ev.description?'<div class="event-desc">'+escapeHtml(ev.description)+'</div>':'')+roster('Going',yes)+roster('Maybe',maybe)+roster('Not going',no)+(staff?'<div style="margin-top:12px"><strong>Staff</strong><div class="roster-names">'+staff+'</div></div>':'');box.appendChild(card)})}function roster(label,people){return people.length?'<div style="margin-top:12px"><strong>'+label+' ('+people.length+')</strong><div class="roster-names">'+people.map(p=>'<span class="roster-name">'+escapeHtml(p.name)+(p.note?' <span class="roster-note">· '+escapeHtml(p.note)+'</span>':'')+'</span>').join('')+'</div></div>':''}load();</script></body></html>
