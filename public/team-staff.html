<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pandaplan · Staff</title><link rel="stylesheet" href="/style.css"></head><body><div class="nav"><a class="brand" id="brand">🐼 pandaplan</a><div class="links"><a id="overview">Overview</a><a id="attend">Attend</a><a class="current" id="staff">Staff</a><a id="people">People</a><a id="categories">Categories</a><a href="/teams.html">Teams</a></div></div><div class="wrap"><h1 id="title">Staff assignments</h1><p class="sub">Assign Team members to event staff roles. A person can hold multiple staff roles in the Team and on different events.</p><div id="events"></div></div><script src="/shared.js"></script><script>const slug=decodeURIComponent(location.pathname.split('/')[2]||'');let state;const base=()=>'/team/'+encodeURIComponent(slug);function nav(){brand.href=base()+'/overview';overview.href=base()+'/overview';attend.href=base()+'/attend';staff.href=base()+'/staff';people.href=base()+'/people';categories.href=base()+'/categories'}async function load(){nav();state=await api('/api/teams/'+encodeURIComponent(slug)+'/state');title.textContent=state.team.name+' · Staff';render()}function render(){events.innerHTML='';const upcoming=sortByDateTime(state.events);if(!upcoming.length){events.innerHTML='<div class="card"><div class="empty">No events yet.</div></div>';return}upcoming.forEach(ev=>{const card=document.createElement('div');card.className='card';const cat=categoryById(state.categories,ev.categoryId);const roles=cat?.requiredStaffRoles||[];card.innerHTML='<div class="card-head"><div><div class="event-title-line"><span class="event-date">'+formatDate(ev.date)+'</span>'+categoryBadge(state.categories,ev.categoryId)+'</div><div class="event-meta">'+formatTimeRange(ev.startTime,ev.endTime)+(ev.location?' · '+escapeHtml(ev.location):'')+'</div></div></div>'+(roles.length?roles.map(role=>{const label=STAFF_ROLES.find(r=>r.id===role)?.label||role;const assigned=new Set(state.staffAssignments[ev.id]?.[role]||[]);const eligible=state.persons.filter(p=>(p.roles||[]).includes(role));return '<div style="margin-top:16px"><strong>'+escapeHtml(label)+'</strong><div class="chip-row" data-role="'+escapeHtml(role)+'">'+(eligible.length?eligible.map(p=>'<button type="button" class="chip '+(assigned.has(p.id)?'active':'')+'" data-person="'+escapeHtml(p.id)+'" data-role="'+escapeHtml(role)+'">'+escapeHtml(p.name)+'</button>').join(''):'<span class="empty">No Team members have this role.</span>')+'</div></div>'}).join(''):'<div class="empty" style="margin-top:12px">This event category has no required staff roles.</div>');events.appendChild(card);card.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>toggle(ev.id,b.dataset.person,b.dataset.role,b.classList.contains('active')))});}async function toggle(eventId,personId,role,active){const url=base()+'/staffAssignments/'+encodeURIComponent(eventId)+'/'+encodeURIComponent(personId);if(active)await api(url+'/'+encodeURIComponent(role),{method:'DELETE'});else await api(url,{method:'PUT',body:JSON.stringify({role})});await load()}load();</script></body></html>
