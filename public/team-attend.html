<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pandaplan · Attend</title><link rel="stylesheet" href="/style.css"></head><body><div class="nav"><a class="brand" id="brand">🐼 pandaplan</a><div class="links"><a id="overview">Overview</a><a class="current" id="attend">Attend</a><a id="staff">Staff</a><a id="people">People</a><a id="categories">Categories</a><a href="/teams.html">Teams</a></div></div><div class="wrap"><h1 id="title">Who's attending?</h1><p class="sub">Pick a Team participant, then choose which events they'll attend.</p><div class="card"><h3>Player</h3><div class="chip-row" id="players"></div></div><div class="card"><h3>Category</h3><div class="chip-row" id="cats" style="margin-bottom:16px"></div><h3>Date</h3><div class="chip-row" id="dates"></div></div><div id="events"></div><div class="saved-note" id="saved"></div><div class="card"><button class="collapsible-button" id="sync">📅 Sync to calendar</button><div class="collapsible-content" id="syncBox"></div></div></div><script src="/shared.js"></script><script>const slug=decodeURIComponent(location.pathname.split('/')[2]||'');let state,personId=null,attendance={},filters={categoryIds:new Set(),dateMode:'upcoming'};const base=()=>'/team/'+encodeURIComponent(slug);function nav(){brand.href=base()+'/overview';overview.href=base()+'/overview';attend.href=base()+'/attend';staff.href=base()+'/staff';people.href=base()+'/people';categories.href=base()+'/categories'}async function load(){nav();state=await api('/api/teams/'+encodeURIComponent(slug)+'/state');title.textContent=state.team.name+' · Attend';const participants=state.persons.filter(p=>p.roles.includes('participant'));const remembered=localStorage.getItem('pandaplan:'+slug+':person');if(remembered&&participants.some(p=>p.id===remembered))personId=remembered;else if(participants.length)personId=participants[0].id;render();if(personId)await loadAttendance()}async function loadAttendance(){const r=await api('/api/teams/'+encodeURIComponent(slug)+'/attendance');attendance=r[personId]||{};renderEvents()}function render(){const participants=state.persons.filter(p=>p.roles.includes('participant'));players.innerHTML=participants.map(p=>'<button class="chip person '+(p.id===personId?'active':'')+'" data-person="'+escapeHtml(p.id)+'">'+escapeHtml(p.name)+'</button>').join('');players.querySelectorAll('[data-person]').forEach(b=>b.onclick=async()=>{personId=b.dataset.person;localStorage.setItem('pandaplan:'+slug+':person',personId);await loadAttendance();render()});if(!participants.length)players.innerHTML='<div class="empty">No participants in this Team.</div>';renderCategoryFilterChips(cats,state.categories,filters.categoryIds,()=>{render();renderEvents()});renderDateFilterChips(dates,filters.dateMode,m=>{filters.dateMode=m;render();renderEvents()});sync.style.display=personId?'':'none';if(personId)renderSubscribeBox(syncBox,location.origin+'/calendar/person/'+encodeURIComponent(personId)+'.ics','Personal calendar');renderEvents()}function renderEvents(){events.innerHTML='';if(!personId){events.innerHTML='<div class="card"><div class="empty">Select a participant.</div></div>';return}const list=sortByDateTime(filterEvents(state.events,filters));if(!list.length){events.innerHTML='<div class="card"><div class="empty">No events match this filter.</div></div>';return}const card=document.createElement('div');card.className='card';list.forEach(ev=>{const e=attendance[ev.id],s=e?.status;const row=document.createElement('div');row.className='attend-row';row.innerHTML='<div class="attend-row-top"><div class="attend-info"><div class="event-title-line"><span class="event-date">'+formatDate(ev.date)+'</span>'+categoryBadge(state.categories,ev.categoryId)+'</div><div class="event-meta">'+[formatTimeRange(ev.startTime,ev.endTime),ev.location?'<a href="'+formatMapsLink(ev.location)+'" target="_blank" class="location-link">'+escapeHtml(ev.location)+'</a>':''].filter(Boolean).join(' · ')+'</div>'+(ev.description?'<div class="event-desc">'+escapeHtml(ev.description)+'</div>':'')+'</div><div class="attend-toggle"><button class="yes '+(s==='yes'?'active':'')+'" data-status="yes">Going</button><button class="maybe '+(s==='maybe'?'active':'')+'" data-status="maybe">Maybe</button><button class="no '+(s==='no'?'active':'')+'" data-status="no">Not going</button></div></div>'+(s==='yes'||s==='maybe'?'<div class="note-field"><input class="note-input" maxlength="200" placeholder="Add note" value="'+escapeHtml(e.note||'')+'"></div>':'');row.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{await save(ev.id,b.dataset.status,e?.note||'')});const ni=row.querySelector('.note-input');if(ni)ni.onblur=()=>save(ev.id,s,ni.value);card.appendChild(row)});events.appendChild(card)}async function save(eventId,status,note){await api('/api/teams/'+encodeURIComponent(slug)+'/attendance/'+encodeURIComponent(personId)+'/'+encodeURIComponent(eventId),{method:'PUT',body:JSON.stringify({status,note})});await loadAttendance();saved.textContent='Saved';setTimeout(()=>saved.textContent='',1200)}load();</script></body></html>
