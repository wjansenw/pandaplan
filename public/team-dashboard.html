<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pandaplan · Team</title><link rel="stylesheet" href="/style.css"></head><body><div class="nav"><a class="brand" id="brand">🐼 pandaplan</a><div class="links"><a class="current" id="overview">Overview</a><a id="eventsLink">Events</a><a id="people">People</a><a id="categories">Categories</a><a href="/teams.html">Teams</a></div></div><div class="wrap"><h1 id="title">Team</h1><p class="sub">Events, attendance and staff.</p><div class="card"><h2>Calendar</h2><div class="subscribe-row"><input id="cal" type="text" readonly onclick="this.select()"><button id="copy" class="btn secondary">Copy</button></div></div><div class="card"><h2>Upcoming events</h2><div id="events"></div></div><div class="card"><div class="card-head"><div><h2>My attendance</h2><div id="summary" class="sub"></div></div><button id="edit" class="btn secondary">Change my attendance</button></div><div id="editor" style="display:none"></div></div><div class="card"><div class="card-head"><div><h2>Staff</h2><div class="sub">Assignments for upcoming events.</div></div><button id="staffEdit" class="btn secondary">Manage staff</button></div><div id="staff"></div></div><div id="saved" class="saved-note"></div></div><script src="/shared.js"></script><script>const slug=decodeURIComponent(location.pathname.split('/')[2]||''),B='/api/teams/'+encodeURIComponent(slug);let state,att={},pid,edit=false,staffEdit=false;const base='/team/'+encodeURIComponent(slug);function esc(s){return escapeHtml(s)}async function load(){brand.href=base+'/overview';eventsLink.href=base+'/events';people.href=base+'/people';categories.href=base+'/categories';state=await api(B+'/state');title.textContent=state.team.name;cal.value=location.origin+'/calendar/team/'+encodeURIComponent(slug)+'.ics';copy.onclick=async()=>{try{await navigator.clipboard.writeText(cal.value);copy.textContent='Copied!'}catch(e){cal.select();document.execCommand('copy');copy.textContent='Select & copy'}setTimeout(()=>copy.textContent='Copy',1500)};const ps=state.persons.filter(p=>(p.roles||[]).includes('participant')),r=localStorage.getItem('pandaplan:'+slug+':person');pid=r&&ps.some(p=>p.id===r)?r:ps[0]?.id;await getAtt();render()}async function getAtt(){const x=await api(B+'/attendance');att=pid?x[pid]||{}:{}}function render(){events.innerHTML='';sortByDateTime(state.events).forEach(e=>{const a=Object.entries(state.attendance).map(([p,x])=>x[e.id]?{name:state.persons.find(q=>q.id===p)?.name,status:x[e.id].status}:null).filter(Boolean),g=a.filter(x=>x.status==='yes'),n=a.filter(x=>x.status==='no');const d=document.createElement('div');d.className='attend-row';d.innerHTML='<strong>'+formatDate(e.date)+'</strong> · '+formatTimeRange(e.startTime,e.endTime)+'<div class="sub">'+g.length+' going · '+n.length+' not going</div>';events.appendChild(d)});renderAttendance();renderStaff()}function renderAttendance(){const ps=state.persons.filter(p=>(p.roles||[]).includes('participant')),p=ps.find(x=>x.id===pid),v=state.events.map(e=>att[e.id]?.status).filter(Boolean);summary.textContent=p?p.name+' · '+v.filter(x=>x==='yes').length+' Going · '+v.filter(x=>x==='maybe').length+' Maybe · '+v.filter(x=>x==='no').length+' Not going':'No participants';editor.style.display=edit?'':'none';if(!edit)return;editor.innerHTML='<div class="chip-row">'+ps.map(x=>'<button class="chip '+(x.id===pid?'active':'')+'" data-p="'+esc(x.id)+'">'+esc(x.name)+'</button>').join('')+'</div><div class="bulk-actions"><button class="btn secondary" id="allY">Going to all</button><button class="btn secondary" id="allN">Not going to all</button><button class="btn" id="done">Done</button></div>';editor.innerHTML+=state.events.map(e=>{const s=att[e.id]?.status;return '<div class="attend-row"><strong>'+formatDate(e.date)+'</strong> · '+formatTimeRange(e.startTime,e.endTime)+'<span class="attend-toggle"><button class="yes '+(s==='yes'?'active':'')+'" data-e="'+e.id+'" data-s="yes">Going</button><button class="maybe '+(s==='maybe'?'active':'')+'" data-e="'+e.id+'" data-s="maybe">Maybe</button><button class="no '+(s==='no'?'active':'')+'" data-e="'+e.id+'" data-s="no">Not going</button></span></div>'}).join('');editor.querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{pid=b.dataset.p;localStorage.setItem('pandaplan:'+slug+':person',pid);await getAtt();renderAttendance()});editor.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>save(b.dataset.e,b.dataset.s));done.onclick=()=>{edit=false;renderAttendance()};allY.onclick=()=>bulk('yes');allN.onclick=()=>bulk('no')}async function save(e,s){await api(B+'/attendance/'+encodeURIComponent(pid)+'/'+e,{method:'PUT',body:JSON.stringify({status:s,note:''})});await getAtt();renderAttendance();render();saved.textContent='Saved';setTimeout(()=>saved.textContent='',1000)}async function bulk(s){const p=state.persons.find(x=>x.id===pid);if(!p||!confirm((s==='yes'?'Going':'Not going')+' to all '+state.events.length+' events for '+p.name+'?'))return;for(const e of state.events)await api(B+'/attendance/'+encodeURIComponent(pid)+'/'+e.id,{method:'PUT',body:JSON.stringify({status:s,note:''}));await getAtt();renderAttendance();render()}function renderStaff(){staff.innerHTML='';sortByDateTime(state.events).forEach(e=>{const a=state.staffAssignments[e.id]||{},names=Object.entries(a).flatMap(([r,ids])=>ids.map(id=>{const p=state.persons.find(x=>x.id===id);return p?(STAFF_ROLES.find(x=>x.id===r)?.label||r)+': '+p.name:null}).filter(Boolean));const d=document.createElement('div');d.className='attend-row';d.innerHTML='<strong>'+formatDate(e.date)+'</strong> · '+formatTimeRange(e.startTime,e.endTime)+'<div class="sub">'+(names.join(' · ')||'No staff assigned')+'</div>';staff.appendChild(d);if(staffEdit){const cat=categoryById(state.categories,e.categoryId);(cat?.requiredStaffRoles||[]).forEach(r=>{const a=new Set(state.staffAssignments[e.id]?.[r]||[]),ok=state.persons.filter(p=>(p.roles||[]).includes(r)),x=document.createElement('div');x.innerHTML='<strong>'+esc(STAFF_ROLES.find(q=>q.id===r)?.label||r)+'</strong><div class="chip-row">'+ok.map(p=>'<button class="chip '+(a.has(p.id)?'active':'')+'" data-e="'+e.id+'" data-p="'+p.id+'" data-r="'+r+'">'+esc(p.name)+'</button>').join('')+'</div>';staff.appendChild(x)})}})}async function toggle(e,p,r,a){const u=B+'/staffAssignments/'+e+'/'+p;if(a)await api(u+'/'+r,{method:'DELETE'});else await api(u,{method:'PUT',body:JSON.stringify({role:r})});state=await api(B+'/state');renderStaff();render()}edit.onclick=()=>{edit=true;renderAttendance()};staffEdit.onclick=()=>{staffEdit=!staffEdit;staffEdit.textContent=staffEdit?'Done':'Manage staff';renderStaff()};load();</script></body></html>
