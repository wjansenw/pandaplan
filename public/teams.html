<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pandaplan · Teams</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="nav"><a class="brand" href="/teams.html">🐼 pandaplan</a><div class="links"><a class="current" href="/teams.html">Teams</a></div></div>
<div class="wrap"><h1>Teams</h1><p class="sub">Manage Teams and cross-Team membership.</p><div id="teams"></div><div class="card"><h2>Create Team</h2><div class="field"><label>Name</label><input id="name" maxlength="200"></div><div class="field"><label>Slug</label><input id="slug" maxlength="100"></div><div class="field"><label>Description</label><textarea id="description" maxlength="500"></textarea></div><button class="btn" id="create">Create Team</button><div class="saved-note" id="note"></div></div></div>
<script src="/shared.js"></script><script>
const ROLE_LABELS={participant:'Participant',coach:'Coach','assistant-coach':'Assistant Coach',trainer:'Trainer',scorekeeper:'Score Keeper',referee:'Referee'};
const api=window.api;
async function load(){const teams=await api('/api/teams');const persons=(await api('/api/state')).persons||[];const box=document.getElementById('teams');box.innerHTML='';teams.forEach(t=>{const card=document.createElement('div');card.className='card';card.innerHTML='<div class="card-head"><div><h2>'+escapeHtml(t.name)+'</h2><div class="sub">/team/'+escapeHtml(t.slug)+'/ · '+t.memberCount+' members</div></div><div><a class="btn secondary" href="/team/'+encodeURIComponent(t.slug)+'/events">Open</a></div></div><p>'+escapeHtml(t.description||'')+'</p><div class="field"><label>Add existing person</label><select><option value="">Select person…</option>'+persons.map(p=>'<option value="'+escapeHtml(p.id)+'">'+escapeHtml(p.name)+'</option>').join('')+'</select></div><div class="member-list"></div>';box.appendChild(card);const list=card.querySelector('.member-list');const select=card.querySelector('select');select.addEventListener('change',async()=>{if(!select.value)return;await api('/api/teams/'+encodeURIComponent(t.slug)+'/members/'+encodeURIComponent(select.value),{method:'POST'});load();});api('/api/teams/'+encodeURIComponent(t.slug)).then(detail=>{list.innerHTML=(detail.members||[]).map(m=>'<div class="person-admin-item"><strong>'+escapeHtml(m.name)+'</strong><div>'+m.roles.map(r=>escapeHtml(ROLE_LABELS[r]||r)).join(', ')+'</div><button class="del" data-id="'+escapeHtml(m.id)+'">Remove</button></div>').join('');list.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{if(confirm('Remove this person from the Team?')){await api('/api/teams/'+encodeURIComponent(t.slug)+'/members/'+encodeURIComponent(b.dataset.id),{method:'DELETE'});load();}});});});}
document.getElementById('name').addEventListener('input',e=>{if(!document.getElementById('slug').dataset.edited)document.getElementById('slug').value=e.target.value.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').replace(/-{2,}/g,'-').slice(0,100)});document.getElementById('slug').addEventListener('input',e=>e.target.dataset.edited='1');document.getElementById('create').onclick=async()=>{const note=document.getElementById('note');try{await api('/api/teams',{method:'POST',body:JSON.stringify({name:document.getElementById('name').value,slug:document.getElementById('slug').value,description:document.getElementById('description').value})});document.getElementById('name').value='';document.getElementById('slug').value='';document.getElementById('description').value='';document.getElementById('slug').dataset.edited='';note.textContent='Created';load()}catch(e){note.textContent=e.message}};load();
</script></body></html>
