<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>pandaplan · Teams</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="nav">
      <a class="brand" href="/teams.html">🐼 pandaplan</a>
      <div class="links">
        <a class="current" href="/teams.html" data-i18n="teams">Teams</a>
      </div>
    </div>

    <div class="wrap">
      <h1 data-i18n="teams">Teams</h1>
      <p class="sub" data-i18n="teamsSubtitle">
        Manage Teams and cross-Team membership. Team-specific roles are managed
        inside each Team.
      </p>
      <div id="teams"></div>

      <div class="card" id="create-team-card" hidden>
        <h2 data-i18n="createTeam">Create Team</h2>
        <div class="field">
          <label data-i18n="name">Name</label
          ><input id="name" maxlength="200" />
        </div>
        <div class="field">
          <label data-i18n="slug">Slug</label
          ><input id="slug" maxlength="100" />
        </div>
        <div class="field">
          <label data-i18n="description">Description</label
          ><textarea id="description" maxlength="500"></textarea>
        </div>
        <button class="btn" id="create" data-i18n="create">Create</button>
        <div class="saved-note" id="note"></div>
      </div>
    </div>

    <script src="/shared.js"></script>
    <script src="/teams.js"></script>
    <script>
      const adminMode =
        new URLSearchParams(window.location.search).get("mode") === "admin";
      const ROLE_LABELS = {
        participant: "participant",
        coach: "coach",
        "assistant-coach": "assistantCoach",
        trainer: "trainer",
        scorekeeper: "scorekeeper",
        referee: "referee",
      };

      function modeUrl(url) {
        if (!adminMode) return url;
        return url + (url.includes("?") ? "&" : "?") + "mode=admin";
      }

      function applyTranslations() {
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.textContent = t(el.dataset.i18n);
        });
      }

      function renderTeam(team, persons) {
        const card = document.createElement("div");
        card.className = "card";

        if (!adminMode) {
          card.innerHTML = `
          <div class="card-head">
            <div><h2>${escapeHtml(team.name)}</h2></div>
            <a class="btn secondary" href="${modeUrl("/team/" + encodeURIComponent(team.slug))}">${escapeHtml(t("openTeam"))}</a>
          </div>`;
          return card;
        }

        card.innerHTML = `
        <div class="card-head">
          <div>
            <h2>${escapeHtml(team.name)}</h2>
            <div class="sub">/team/${escapeHtml(team.slug)}/ · ${escapeHtml(t("memberCount", { count: team.memberCount }))}</div>
          </div>
          <a class="btn secondary" href="${modeUrl("/team/" + encodeURIComponent(team.slug))}">${escapeHtml(t("openTeam"))}</a>
        </div>
        <div class="field"><label>${escapeHtml(t("name"))}</label><input class="edit-name" value="${escapeHtml(team.name)}" maxlength="200"></div>
        <div class="field"><label>${escapeHtml(t("slug"))}</label><input class="edit-slug" value="${escapeHtml(team.slug)}" maxlength="100"></div>
        <div class="field"><label>${escapeHtml(t("description"))}</label><textarea class="edit-description" maxlength="500">${escapeHtml(team.description || "")}</textarea></div>
        <div class="btn-row">
          <button class="btn save">${escapeHtml(t("saveTeam"))}</button>
          <button class="btn secondary delete">${escapeHtml(t("deleteTeam"))}</button>
        </div>
        <div class="field">
          <label>${escapeHtml(t("addExistingPerson"))}</label>
          <select class="add-person"><option value="">${escapeHtml(t("selectPerson"))}</option>${persons.map((p) => `<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)}</option>`).join("")}</select>
        </div>
        <div class="member-list"></div>
        <div class="card" style="margin-top:1rem">
          <h3>${escapeHtml(t("admin"))}</h3>
          <div class="btn-row">
            <button class="btn secondary remove-all-attendance">${escapeHtml(t("removeAllAttendance"))}</button>
            <button class="btn secondary remove-all-events">${escapeHtml(t("removeAllEvents"))}</button>
          </div>
        </div>`;

        const list = card.querySelector(".member-list");
        const select = card.querySelector(".add-person");

        select.onchange = async () => {
          if (!select.value) return;
          try {
            await api(
              "/api/teams/" +
                encodeURIComponent(team.slug) +
                "/members/" +
                encodeURIComponent(select.value),
              { method: "POST" },
            );
            load();
          } catch (e) {
            alert(e.message);
          }
        };

        card.querySelector(".save").onclick = async () => {
          try {
            await api("/api/teams/" + encodeURIComponent(team.slug), {
              method: "PUT",
              body: JSON.stringify({
                name: card.querySelector(".edit-name").value,
                newSlug: card.querySelector(".edit-slug").value,
                description: card.querySelector(".edit-description").value,
              }),
            });
            load();
          } catch (e) {
            alert(e.message || t("teamSaveFailed"));
          }
        };

        card.querySelector(".delete").onclick = async () => {
          if (!confirm(t("deleteTeamConfirm"))) return;
          try {
            await api("/api/teams/" + encodeURIComponent(team.slug), {
              method: "DELETE",
            });
            load();
          } catch (e) {
            alert(e.message || t("teamDeleteFailed"));
          }
        };

        card.querySelector(".remove-all-attendance").onclick = async () => {
          if (!confirm(t("removeAllAttendanceConfirm"))) return;
          try {
            await api(
              "/api/teams/" + encodeURIComponent(team.slug) + "/attendance",
              { method: "DELETE" },
            );
            alert(t("attendanceRemoved"));
          } catch (e) {
            alert(e.message || t("teamDataActionFailed"));
          }
        };

        card.querySelector(".remove-all-events").onclick = async () => {
          if (!confirm(t("removeAllEventsConfirm"))) return;
          try {
            await api(
              "/api/teams/" + encodeURIComponent(team.slug) + "/events",
              { method: "DELETE" },
            );
            alert(t("eventsRemoved"));
          } catch (e) {
            alert(e.message || t("teamDataActionFailed"));
          }
        };

        api("/api/teams/" + encodeURIComponent(team.slug)).then((detail) => {
          list.innerHTML = (detail.members || [])
            .map(
              (m) => `
          <div class="person-admin-item">
            <strong>${escapeHtml(m.name)}</strong>
            <div>${m.roles.map((r) => escapeHtml(t(ROLE_LABELS[r] || r))).join(", ")}</div>
            <button class="del" data-id="${escapeHtml(m.id)}">${escapeHtml(t("removePerson"))}</button>
          </div>`,
            )
            .join("");
          list.querySelectorAll(".del").forEach((button) => {
            button.onclick = async () => {
              if (!confirm(t("removePersonConfirm"))) return;
              try {
                await api(
                  "/api/teams/" +
                    encodeURIComponent(team.slug) +
                    "/members/" +
                    encodeURIComponent(button.dataset.id),
                  { method: "DELETE" },
                );
                load();
              } catch (e) {
                alert(e.message);
              }
            };
          });
        });

        return card;
      }

      async function load() {
        const teams = await api("/api/teams");
        const persons = adminMode
          ? (await api("/api/state")).persons || []
          : [];
        const box = document.getElementById("teams");
        box.innerHTML = "";
        if (!teams.length) {
          box.innerHTML = `<div class="card"><p>${escapeHtml(t("noTeams"))}</p></div>`;
        } else {
          teams.forEach((team) => box.appendChild(renderTeam(team, persons)));
        }
      }

      if (adminMode) {
        document.getElementById("create-team-card").hidden = false;
        document.getElementById("name").oninput = (e) => {
          const slug = document.getElementById("slug");
          if (!slug.dataset.edited)
            slug.value = e.target.value
              .toLowerCase()
              .trim()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-+|-+$/g, "")
              .replace(/-{2,}/g, "-")
              .slice(0, 100);
        };
        document.getElementById("slug").oninput = (e) => {
          e.target.dataset.edited = "1";
        };
        document.getElementById("create").onclick = async () => {
          const note = document.getElementById("note");
          try {
            await api("/api/teams", {
              method: "POST",
              body: JSON.stringify({
                name: document.getElementById("name").value,
                slug: document.getElementById("slug").value,
                description: document.getElementById("description").value,
              }),
            });
            document.getElementById("name").value = "";
            document.getElementById("slug").value = "";
            document.getElementById("description").value = "";
            document.getElementById("slug").dataset.edited = "";
            note.textContent = t("created");
            load();
          } catch (e) {
            note.textContent = e.message || t("teamCreateFailed");
          }
        };
      }

      applyTranslations();
      load();
    </script>
  </body>
</html>
