<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>pandaplan · Teams</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/navigation.css" data-pandanav-css />
  </head>
  <body>
    <div class="nav"></div>
    <div class="wrap">
      <h1 data-i18n="teams">Teams</h1>
      <p class="sub" data-i18n="teamsSubtitle">
        Manage Teams and cross-Team membership. Team-specific roles are managed
        inside each Team.
      </p>
      <div id="teams"></div>
      <div class="card" id="create-team-card" hidden>
        <h2 data-i18n="createTeam">Create Team</h2>
        <div class="field">
          <label data-i18n="name">Name</label
          ><input id="name" maxlength="200" />
        </div>
        <div class="field">
          <label data-i18n="slug">Slug</label
          ><input id="slug" maxlength="100" />
        </div>
        <div class="field">
          <label data-i18n="description">Description</label
          ><textarea id="description" maxlength="500"></textarea>
        </div>
        <button class="btn" id="create" data-i18n="create">Create</button>
        <div class="saved-note" id="note"></div>
      </div>
    </div>
    <script src="/shared.js"></script>
    <script src="/about-nav.js"></script>
    <script src="/navigation.js"></script>
    <script src="/shared-api.js"></script>
    <script src="/shared-team.js"></script>
    <script src="/teams.js"></script>
    <script src="/teams-api.js"></script>
    <script src="/teams-render.js"></script>
    <script src="/teams-controller.js"></script>
  </body>
</html>
