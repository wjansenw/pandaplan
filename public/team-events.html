<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pandaplan · Events</title><link rel="stylesheet" href="/style.css"></head><body><div class="nav"><a class="brand" id="brand">🐼 pandaplan</a><div class="links"><a id="overviewLink">Overview</a><a class="current">Events</a><a id="peopleLink">People</a><a id="categoriesLink">Categories</a></div></div><div class="wrap"><h1 id="title">Events</h1><p class="sub" id="subtitle"></p><div class="card"><div class="card-head"><h2>New event</h2></div><div class="field"><label>Category</label><select id="category"><option value="">No category</option></select></div><div class="field-row"><div class="field"><label>Date</label><input id="date" type="date"></div></div><div class="field-row"><div class="field"><label>Start time</label><input id="start" type="time"></div><div class="field"><label>End time</label><input id="end" type="time"></div></div><div class="field"><label>Location</label><input id="location"></div><div class="field"><label>Description</label><textarea id="description"></textarea></div><button class="btn" id="save">Add event</button><div class="saved-note" id="note"></div></div><div id="events"></div></div><script src="/shared.js"></script><script>const slug=decodeURIComponent(location.pathname.split('/')[2]||'');let team,categories=[],events=[];const apiBase=()=>'/api/teams/'+encodeURIComponent(slug);const $=id=>document.getElementById(id);async function load(){try{team=await api('/api/teams/'+encodeURIComponent(slug));categories=await api(apiBase()+'/categories');events=await api(apiBase()+'/events');document.title='pandaplan · '+team.name+' · Events';$('title').textContent=team.name+' · Events';$('subtitle').textContent=team.description||'';const base='/team/'+encodeURIComponent(team.slug);$('brand').href=base;$('overviewLink').href=base+'/overview';$('peopleLink').href=base+'/people';$('categoriesLink').href=base+'/categories';$('category').innerHTML='<option value="">No category</option>'+categories.map(c=>'<option value="'+escapeHtml(c.id)+'">'+escapeHtml(c.name)+'</option>').join('');render()}catch(e){document.body.innerHTML='<div class="wrap"><div class="card"><h1>Team not found</h1><p>'+escapeHtml(e.message)+'</p></div></div>'}}function render(){const box=$('events');box.innerHTML='';if(!events.length){box.innerHTML='<div class="card"><div class="empty">No events yet.</div></div>';return}events.forEach(e=>{const c=categories.find(x=>x.id===e.categoryId);const card=document.createElement('div');card.className='card';card.innerHTML='<div class="card-head"><div><h2>'+escapeHtml(e.date)+' '+escapeHtml(e.startTime||'')+'</h2><div class="sub">'+escapeHtml(c?c.name:'No category')+(e.location?' · '+escapeHtml(e.location):'')+'</div></div><button class="del">Delete</button></div>'+(e.description?'<p>'+escapeHtml(e.description)+'</p>':'');card.querySelector('.del').onclick=async()=>{if(!confirm('Delete this event?'))return;await api(apiBase()+'/events/'+encodeURIComponent(e.id),{method:'DELETE'});events=await api(apiBase()+'/events');render()};box.appendChild(card)})}$('save').onclick=async()=>{try{const date=$('date').value;if(!date){$('note').textContent='Date is required.';return}await api(apiBase()+'/events',{method:'POST',body:JSON.stringify({categoryId:$('category').value||null,date,startTime:$('start').value,endTime:$('end').value,location:$('location').value,description:$('description').value})});$('date').value='';$('start').value='';$('end').value='';$('location').value='';$('description').value='';$('note').textContent='Added.';events=await api(apiBase()+'/events');render()}catch(e){$('note').textContent=e.message}};load();</script></body></html>
