<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>pandaplan</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="nav">
      <a class="brand" id="brand">🐼 pandaplan</a>
      <div class="links">
        <a id="overviewLink" data-i18n="overview">Overview</a>
        <a class="current" data-i18n="events">Events</a>
        <a id="peopleLink" data-i18n="persons" data-admin-only>People</a>
        <a id="categoriesLink" data-i18n="categories" data-admin-only>Categories</a>
      </div>
    </div>

    <main class="wrap">
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>

      <section class="card">
        <div class="card-head">
          <h2 data-i18n="newEvent">New event</h2>
        </div>
        <div class="field">
          <label data-i18n="subject">Subject</label>
          <input id="subject" />
        </div>
        <div class="field">
          <label data-i18n="category">Category</label>
          <select id="category"></select>
        </div>
        <div class="field-row">
          <div class="field">
            <label data-i18n="date">Date</label>
            <input id="date" type="date" />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label data-i18n="startTime">Start time</label>
            <input id="start" type="time" />
          </div>
          <div class="field">
            <label data-i18n="endTime">End time</label>
            <input id="end" type="time" />
          </div>
        </div>
        <div class="field">
          <label data-i18n="location">Location</label>
          <input id="location" data-i18n-placeholder="locationPlaceholder" />
        </div>
        <div class="field">
          <label data-i18n="description">Description</label>
          <textarea id="description" data-i18n-placeholder="descriptionPlaceholder"></textarea>
        </div>
        <button class="btn" id="save" data-i18n="saveEvent">Save event</button>
        <div class="saved-note" id="note"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 data-i18n="recurringEvents">Recurring events</h2>
        </div>
        <p class="sub" data-i18n="recurringHelp">Create multiple normal events on selected weekdays within a date range.</p>
        <div class="field">
          <label data-i18n="subject">Subject</label>
          <input id="recSubject" />
        </div>
        <div class="field">
          <label data-i18n="category">Category</label>
          <select id="recCategory"></select>
        </div>
        <div class="field-row">
          <div class="field">
            <label data-i18n="startDate">Start date</label>
            <input id="recStartDate" type="date" />
          </div>
          <div class="field">
            <label data-i18n="endDate">End date</label>
            <input id="recEndDate" type="date" />
          </div>
        </div>
        <div class="field">
          <label data-i18n="weekdays">Weekdays</label>
          <div id="recWeekdays" class="chip-row"></div>
        </div>
        <button class="btn" id="createRecurring" data-i18n="createRecurring">Create recurring events</button>
        <div class="saved-note" id="recNote"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 data-i18n="events">Events</h2>
        </div>
        <div id="list"></div>
      </section>
    </main>

    <script src="/shared.js"></script><script src="/about-nav.js"></script><script src="/shared-api.js"></script><script src="/shared-team.js"></script><script src="/team-events-api.js"></script><script src="/team-events-render.js"></script><script src="/team-events.js"></script>
  </body>
</html>
