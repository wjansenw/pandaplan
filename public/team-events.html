<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>pandaplan · Events</title><link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="nav"><a class="brand" id="brand">🐼 pandaplan</a><div class="links"><a id="overviewLink">Overview</a><a class="current" data-admin-only>Events</a><a id="peopleLink" data-admin-only>People</a><a id="categoriesLink" data-admin-only>Categories</a></div></div>
<div class="wrap">
<h1 id="title">Events</h1><p class="sub" id="subtitle"></p>
<div class="card"><div class="card-head"><h2>New event</h2></div>
<div class="field"><label>Subject</label><input id="subject" placeholder="e.g. Match U13 vs Tigers"></div>
<div class="field"><label>Category</label><select id="category"><option value="">No category</option></select></div>
<div class="field-row"><div class="field"><label>Date</label><input id="date" type="date"></div></div>
<div class="field-row"><div class="field"><label>Start time</label><input id="start" type="time"></div><div class="field"><label>End time</label><input id="end" type="time"></div></div>
<div class="field"><label>Location</label><input id="location"></div><div class="field"><label>Description</label><textarea id="description"></textarea></div>
<button class="btn" id="save">Add event</button><div class="saved-note" id="note"></div></div>
<div class="card"><div class="card-head"><h2>Import from ICS feed</h2></div><p class="sub">Enter a calendar feed URL. Each event is imported using its subject, date, time and location. Events already matching all four fields are skipped.</p><div class="field"><label>ICS feed URL</label><input id="icsUrl" type="url" placeholder="https://example.com/calendar.ics"></div><button class="btn" id="importIcs">Import events</button><div class="saved-note" id="importNote"></div></div>
<div id="events"></div></div>
<script src="/shared.js"></script>
<script>
const slug=decodeURIComponent(location.pathname.split('/')[2]||'');let team,categories=[],events=[];const adminMode=new URLSearchParams(location.search).get('mode')==='admin';const modeUrl=url=>adminMode?url+(url.includes('?')?'&':'?')+'mode=admin':url;const apiBase=()=>'/api/teams/'+encodeURIComponent(slug);const $=id=>document.getElementById(id);
async function load(){try{team=await api('/api/teams/'+encodeURIComponent(slug));categories=await api(apiBase()+'/categories');events=await api(apiBase()+'/events');document.title='pandaplan · '+team.name+' · Events';$('title').textContent=team.name+' · Events';$('subtitle').textContent=team.description||'';const base='/team/'+encodeURIComponent(team.slug);$('brand').href=modeUrl(base+'/overview');$('overviewLink').href=modeUrl(base+'/overview');$('peopleLink').href=modeUrl(base+'/people');$('categoriesLink').href=modeUrl(base+'/categories');document.querySelectorAll('[data-admin-only]').forEach(el=>el.hidden=!adminMode);$('category').innerHTML='<option value="">No category</option>'+categories.map(c=>'<option value="'+escapeHtml(c.id)+'">'+escapeHtml(c.name)+'</option>').join('');render()}catch(e){document.body.innerHTML='<div class="wrap"><div class="card"><h1>Team not found</h1><p>'+escapeHtml(e.message)+'</p></div></div>'}}
function eventForm(e){return '<div class="edit-form"><div class="field"><label>Subject</label><input class="edit-subject" value="'+escapeHtml(e.subject||'')+'"></div><div class="field"><label>Category</label><select class="edit-category"><option value="">No category</option>'+categories.map(c=>'<option value="'+escapeHtml(c.id)+'" '+(c.id===e.categoryId?'selected':'')+'>'+escapeHtml(c.name)+'</option>').join('')+'</select></div><div class="field-row"><div class="field"><label>Date</label><input class="edit-date" type="date" value="'+escapeHtml(e.date||'')+'"></div><div class="field"><label>Start time</label><input class="edit-start" type="time" value="'+escapeHtml(e.startTime||'')+'"></div><div class="field"><label>End time</label><input class="edit-end" type="time" value="'+escapeHtml(e.endTime||'')+'"></div></div><div class="field"><label>Location</label><input class="edit-location" value="'+escapeHtml(e.location||'')+'"></div><div class="field"><label>Description</label><textarea class="edit-description">'+escapeHtml(e.description||'')+'</textarea></div><button class="btn save-edit">Save</button> <button class="btn secondary cancel-edit">Cancel</button><span class="saved-note edit-note"></span></div>'}
function render(){const box=$('events');box.innerHTML='';if(!events.length){box.innerHTML='<div class="card"><div class="empty">No events yet.</div></div>';return}events.forEach(e=>{const c=categories.find(x=>x.id===e.categoryId);const card=document.createElement('div');card.className='card';card.innerHTML='<div class="card-head"><div><h2>'+escapeHtml(e.subject||'Untitled event')+'</h2><div class="sub">'+escapeHtml(e.date)+(e.startTime?' · '+escapeHtml(e.startTime):'')+(e.endTime?' – '+escapeHtml(e.endTime):'')+(c?' · '+escapeHtml(c.name):'')+(e.location?' · '+escapeHtml(e.location):'')+'</div></div><div><button class="edit">Edit</button> <button class="del">Delete</button></div></div>'+(e.description?'<p>'+escapeHtml(e.description)+'</p>':'')+eventForm(e);const form=card.querySelector('.edit-form');form.hidden=true;card.querySelector('.edit').onclick=()=>{form.hidden=false;card.querySelector('.edit').hidden=true};card.querySelector('.cancel-edit').onclick=()=>{form.hidden=true;card.querySelector('.edit').hidden=false};card.querySelector('.save-edit').onclick=async()=>{try{const subject=form.querySelector('.edit-subject').value.trim();const date=form.querySelector('.edit-date').value;if(!subject||!date){form.querySelector('.edit-note').textContent='Subject and date are required.';return}await api(apiBase()+'/events/'+encodeURIComponent(e.id),{method:'PUT',body:JSON.stringify({subject,categoryId:form.querySelector('.edit-category').value||null,date,startTime:form.querySelector('.edit-start').value,endTime:form.querySelector('.edit-end').value,location:form.querySelector('.edit-location').value,description:form.querySelector('.edit-description').value})});events=await api(apiBase()+'/events');render()}catch(err){form.querySelector('.edit-note').textContent=err.message}};card.querySelector('.del').onclick=async()=>{if(!confirm('Delete this event?'))return;await api(apiBase()+'/events/'+encodeURIComponent(e.id),{method:'DELETE'});events=await api(apiBase()+'/events');render()};box.appendChild(card)})}
$('save').onclick=async()=>{try{const date=$('date').value;if(!date){$('note').textContent='Date is required.';return}const subject=$('subject').value.trim();if(!subject){$('note').textContent='Subject is required.';return}await api(apiBase()+'/events',{method:'POST',body:JSON.stringify({subject,categoryId:$('category').value||null,date,startTime:$('start').value,endTime:$('end').value,location:$('location').value,description:$('description').value})});$('subject').value='';$('date').value='';$('start').value='';$('end').value='';$('location').value='';$('description').value='';$('note').textContent='Added.';events=await api(apiBase()+'/events');render()}catch(e){$('note').textContent=e.message}};
$('importIcs').onclick=async()=>{const url=$('icsUrl').value.trim();if(!url){$('importNote').textContent='ICS feed URL is required.';return}const button=$('importIcs');button.disabled=true;$('importNote').textContent='Importing…';try{const result=await api(apiBase()+'/events/import-ics',{method:'POST',body:JSON.stringify({url})});events=result.events;$('importNote').textContent='Found '+result.found+' events: '+result.created+' created, '+result.skipped+' already existed.';render()}catch(e){$('importNote').textContent=e.message}finally{button.disabled=false}};load();
</script></body></html>
