<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pandaplan · Team</title><link rel="stylesheet" href="/style.css"></head><body><div class="nav"><a class="brand" id="brand">🐼 pandaplan</a><div class="links"><a id="eventsLink">Events</a><a id="peopleLink">People</a><a id="categoriesLink">Categories</a><a href="/teams.html">Teams</a></div></div><div class="wrap"><h1 id="title"></h1><p class="sub" id="description"></p><div class="card"><h2>Team overview</h2><p>Use the Team-specific pages to manage events, people and categories.</p><div class="btn-row"><a class="btn" id="openEvents">Events</a><a class="btn secondary" id="openPeople">People</a><a class="btn secondary" id="openCategories">Categories</a></div></div></div><script src="/shared.js"></script><script>const slug=decodeURIComponent(location.pathname.split('/')[2]||'');async function load(){try{const t=await api('/api/teams/'+encodeURIComponent(slug));document.title='pandaplan · '+t.name;title.textContent=t.name;description.textContent=t.description||'';const base='/team/'+encodeURIComponent(t.slug);eventsLink.href=base+'/events';peopleLink.href=base+'/people';categoriesLink.href=base+'/categories';openEvents.href=eventsLink.href;openPeople.href=peopleLink.href;openCategories.href=categoriesLink.href;brand.href=eventsLink.href}catch(e){document.body.innerHTML='<div class="wrap"><div class="card"><h1>Team not found</h1><p>'+escapeHtml(e.message)+'</p><a class="btn" href="/teams.html">Teams</a></div></div>'}}load();</script></body></html>
