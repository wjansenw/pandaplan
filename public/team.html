<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pandaplan · Team</title><link rel="stylesheet" href="/style.css"></head><body><div class="nav"><a class="brand" id="brand">🐼 pandaplan</a><div class="links"><a id="eventsLink">Events</a><a id="overviewLink">Overview</a><a id="attendLink">Attend</a><a id="staffLink">Staff</a><a id="peopleLink">People</a><a id="categoriesLink">Categories</a><a href="/teams.html">Teams</a></div></div><div class="wrap"><h1 id="title"></h1><p class="sub" id="description"></p><div class="card"><h2>Team management</h2><p>Manage this Team without exposing other Teams.</p><div class="btn-row"><a class="btn" id="openOverview">Overview</a><a class="btn secondary" id="openAttend">Attend</a><a class="btn secondary" id="openEvents">Events</a><a class="btn secondary" id="openPeople">People</a><a class="btn secondary" id="openStaff">Staff</a><a class="btn secondary" id="openCategories">Categories</a></div></div><div class="card"><h2>Team calendar</h2><p>Subscribe to all events belonging to this Team.</p><div class="btn-row"><a class="btn secondary" id="calendar" target="_blank">Open calendar feed</a></div></div></div><script src="/shared.js"></script><script>const slug=decodeURIComponent(location.pathname.split('/')[2]||'');async function load(){try{const t=await api('/api/teams/'+encodeURIComponent(slug));document.title='pandaplan · '+t.name;title.textContent=t.name;description.textContent=t.description||'';const b='/team/'+encodeURIComponent(t.slug);overviewLink.href=b+'/overview';attendLink.href=b+'/attend';eventsLink.href=b+'/events';staffLink.href=b+'/staff';peopleLink.href=b+'/people';categoriesLink.href=b+'/categories';openOverview.href=overviewLink.href;openAttend.href=attendLink.href;openEvents.href=eventsLink.href;openStaff.href=staffLink.href;openPeople.href=peopleLink.href;openCategories.href=categoriesLink.href;calendar.href='/calendar/team/'+encodeURIComponent(t.slug)+'.ics';brand.href=overviewLink.href}catch(e){document.body.innerHTML='<div class="wrap"><div class="card"><h1>Team not found</h1><p>'+escapeHtml(e.message)+'</p><a class="btn" href="/teams.html">Teams</a></div></div>'}}load();</script></body></html>
