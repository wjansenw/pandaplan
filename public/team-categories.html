<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pandaplan · Categories</title><link rel="stylesheet" href="/style.css"></head><body><div class="nav"><a class="brand" id="brand">🐼 pandaplan</a><div class="links"><a id="events">Events</a><a id="people">People</a><a class="current">Categories</a><a href="/teams.html">Teams</a></div></div><div class="wrap"><h1 id="title">Categories</h1><p class="sub">Categories and required staff roles for this Team.</p><div class="card"><div id="list"></div><div class="field"><label>Name</label><input id="name"></div><button class="btn" id="add">Add category</button><div id="note" class="saved-note"></div></div></div><script src="/shared.js"></script><script>const slug=decodeURIComponent(location.pathname.split('/')[2]||'');const roleOpts=STAFF_ROLES;let cats=[];async function load(){const t=await api('/api/teams/'+encodeURIComponent(slug));const b='/team/'+encodeURIComponent(slug);brand.href=b+'/events';events.href=b+'/events';people.href=b+'/people';title.textContent=t.name+' · Categories';cats=await api('/api/teams/'+encodeURIComponent(slug)+'/categories');render()}function render(){list.innerHTML=cats.map(c=>'<div class="person-admin-item"><div class="person-head"><strong>'+escapeHtml(c.name)+'</strong><button class="del" data-id="'+escapeHtml(c.id)+'">Remove</button></div><div class="chip-row" data-id="'+escapeHtml(c.id)+'"></div></div>').join('');cats.forEach(c=>{const box=list.querySelector('[data-id="'+CSS.escape(c.id)+'"]');const set=new Set(c.requiredStaffRoles||[]);renderMultiSelectChips(roleOpts,set,async()=>{cats=await api('/api/teams/'+encodeURIComponent(slug)+'/categories/'+encodeURIComponent(c.id),{method:'PUT',body:JSON.stringify({name:c.name,color:c.color,requiredStaffRoles:[...set]})});render()},box)});list.querySelectorAll('[data-id]').forEach(()=>{});list.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{if(confirm('Remove this category?')){cats=await api('/api/teams/'+encodeURIComponent(slug)+'/categories/'+encodeURIComponent(b.dataset.id),{method:'DELETE'});render()}})}function renderMultiSelectChips(opts,set,cb,box){box.innerHTML='';opts.forEach(o=>{const x=document.createElement('button');x.type='button';x.className='chip'+(set.has(o.id)?' active':'');x.textContent=o.label;x.onclick=()=>{set.has(o.id)?set.delete(o.id):set.add(o.id);cb()};box.appendChild(x)})}add.onclick=async()=>{if(!name.value.trim()){note.textContent='Name is required.';return}cats=await api('/api/teams/'+encodeURIComponent(slug)+'/categories',{method:'POST',body:JSON.stringify({name:name.value})});name.value='';render()};load();</script></body></html>
