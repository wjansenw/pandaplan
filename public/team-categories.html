<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>pandaplan · Categories</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="nav">
      <a class="brand" id="brand">🐼 pandaplan</a>
      <div class="links">
        <a id="overview" data-i18n="overview">Overview</a
        ><a id="people" data-admin-only data-i18n="peopleNav">People</a
        ><a class="current" data-admin-only data-i18n="categories">Categories</a
        ><a id="events" data-admin-only data-i18n="events">Events</a>
      </div>
    </div>
    <div class="wrap">
      <h1 id="title" data-i18n="categories">Categories</h1>
      <p class="sub" data-i18n="categoriesSubtitle">
        Categories and required staff roles for this Team.
      </p>
      <div class="card">
        <div id="list"></div>
        <div class="field">
          <label data-i18n="name">Name</label
          ><input id="name" type="text" autocomplete="off" />
        </div>
        <button class="btn" id="add" type="button" data-i18n="addCategory">
          Add category
        </button>
        <div id="note" class="saved-note"></div>
      </div>
    </div>
    <script src="/shared.js"></script>
    <script>
      const slug = decodeURIComponent(location.pathname.split("/")[2] || "");
      const roleOpts = STAFF_ROLES;
      let cats = [];
      const adminMode =
        new URLSearchParams(location.search).get("mode") === "admin";
      const modeUrl = (url) =>
        adminMode ? url + (url.includes("?") ? "&" : "?") + "mode=admin" : url;
      const apiBase = () => "/api/teams/" + encodeURIComponent(slug);
      const $ = (id) => document.getElementById(id);
      function applyTranslations() {
        document.documentElement.lang =
          currentLanguage === "nl-BE" ? "nl" : "en";
        document
          .querySelectorAll("[data-i18n]")
          .forEach((el) => (el.textContent = t(el.dataset.i18n)));
      }
      function nav() {
        const b = "/team/" + encodeURIComponent(slug);
        $("brand").href = modeUrl(b + "/overview");
        $("overview").href = modeUrl(b + "/overview");
        $("people").href = modeUrl(b + "/people");
        $("events").href = modeUrl(b + "/events");
        document
          .querySelectorAll("[data-admin-only]")
          .forEach((el) => (el.hidden = !adminMode));
      }
      function error(e) {
        $("note").textContent =
          e && e.message ? e.message : t("couldNotSaveCategory");
      }
      async function load() {
        try {
          applyTranslations();
          const team = await api(apiBase());
          nav();
          $("title").textContent = team.name + " · " + t("categories");
          cats = await api(apiBase() + "/categories");
          render();
        } catch (e) {
          error(e);
        }
      }
      function render() {
        $("list").innerHTML = cats
          .map(
            (c) =>
              '<div class="person-admin-item"><div class="person-head"><strong>' +
              escapeHtml(c.name) +
              '</strong><button class="del" type="button" data-id="' +
              escapeHtml(c.id) +
              '">' +
              escapeHtml(t("remove")) +
              '</button></div><div class="chip-row" data-role-box="' +
              escapeHtml(c.id) +
              '"></div></div>',
          )
          .join("");
        cats.forEach((c) => {
          const box = $("list").querySelector(
            '[data-role-box="' + CSS.escape(c.id) + '"]',
          );
          const set = new Set(c.requiredStaffRoles || []);
          renderChips(
            roleOpts,
            set,
            async () => {
              try {
                cats = await api(
                  apiBase() + "/categories/" + encodeURIComponent(c.id),
                  {
                    method: "PUT",
                    body: JSON.stringify({
                      name: c.name,
                      color: c.color,
                      requiredStaffRoles: [...set],
                    }),
                  },
                );
                render();
              } catch (e) {
                error(e);
              }
            },
            box,
          );
        });
        $("list")
          .querySelectorAll(".del")
          .forEach(
            (b) =>
              (b.onclick = async () => {
                if (!confirm(t("confirmRemoveCategory"))) return;
                try {
                  cats = await api(
                    apiBase() +
                      "/categories/" +
                      encodeURIComponent(b.dataset.id),
                    { method: "DELETE" },
                  );
                  render();
                } catch (e) {
                  error(e);
                }
              }),
          );
      }
      function renderChips(opts, set, cb, box) {
        box.innerHTML = "";
        opts.forEach((o) => {
          const x = document.createElement("button");
          x.type = "button";
          x.className = "chip" + (set.has(o.id) ? " active" : "");
          x.textContent = o.label;
          x.onclick = () => {
            set.has(o.id) ? set.delete(o.id) : set.add(o.id);
            cb();
          };
          box.appendChild(x);
        });
      }
      $("add").onclick = async () => {
        const name = $("name").value.trim();
        if (!name) {
          $("note").textContent = t("nameRequired");
          $("name").focus();
          return;
        }
        $("add").disabled = true;
        $("note").textContent = "";
        try {
          cats = await api(apiBase() + "/categories", {
            method: "POST",
            body: JSON.stringify({ name, requiredStaffRoles: [] }),
          });
          $("name").value = "";
          $("note").textContent = t("added");
          render();
        } catch (e) {
          error(e);
        } finally {
          $("add").disabled = false;
        }
      };
      $("name").addEventListener("keydown", (e) => {
        if (e.key === "Enter") $("add").click();
      });
      load();
    </script>
  </body>
</html>
