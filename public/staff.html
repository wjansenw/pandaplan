<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pandaplan · Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="nav">
  <a class="brand" href="/overview.html">🐼 pandaplan</a>
  <button class="hamburger" id="navToggle">☰</button>
  <div class="links" id="navLinks">
    <a href="/overview.html">Overview</a>
    <a href="/">Attend</a>
    <a href="/staff.html" class="current">Staff</a>
    <a href="/admin.html">Admin</a>
  </div>
</div>

<div class="wrap">
  <h1>Staff assignments</h1>
  <p class="sub">Assign staff members to events based on required roles.</p>

  <div class="card">
    <h3>Category</h3>
    <div class="chip-row" id="categoryFilter" style="margin-bottom:16px;"></div>
    <h3>Date</h3>
    <div class="chip-row" id="dateFilter"></div>
  </div>

  <div id="staffSection"></div>

  <div class="saved-note" id="savedNote"></div>
</div>

<script src="/shared.js"></script>
<script>
let persons = [];
let categories = [];
let events = [];
let staffAssignments = {};
let filters = { categoryIds: new Set(), dateMode: 'upcoming' };

async function loadAll() {
  const state = await api('/api/state');
  persons = state.persons || [];
  categories = state.categories || [];
  events = state.events || [];
  staffAssignments = state.staffAssignments || {};

  renderFilters();
  renderStaffSection();
  setupMobileNav();
}

function setupMobileNav() {
  const toggle = document.getElementById('navToggle');
  const links = document.getElementById('navLinks');
  toggle.addEventListener('click', () => {
    links.classList.toggle('mobile-open');
  });
  links.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      links.classList.remove('mobile-open');
    });
  });
}

function renderFilters() {
  renderCategoryFilterChips(document.getElementById('categoryFilter'), categories, filters.categoryIds, () => {
    renderFilters();
    renderStaffSection();
  });
  renderDateFilterChips(document.getElementById('dateFilter'), filters.dateMode, (mode) => {
    filters.dateMode = mode;
    renderFilters();
    renderStaffSection();
  });
}

function renderStaffSection() {
  const section = document.getElementById('staffSection');
  section.innerHTML = '';

  if (!events.length) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<div class="empty">No events yet — add some in Admin first.</div>';
    section.appendChild(card);
    return;
  }

  const filtered = sortByDateTime(filterEvents(events, filters));

  if (!filtered.length) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<div class="empty">No events match the current filters.</div>';
    section.appendChild(card);
    return;
  }

  filtered.forEach(ev => {
    const cat = categoryById(categories, ev.categoryId);
    const requiredRoles = cat ? (cat.requiredStaffRoles || []) : [];

    if (!requiredRoles.length) return;

    const card = document.createElement('div');
    card.className = 'card';
    const timeRange = formatTimeRange(ev.startTime, ev.endTime);
    const locationHtml = ev.location 
      ? `<a href="${formatMapsLink(ev.location)}" target="_blank" class="location-link">${escapeHtml(ev.location)}</a>`
      : '';

    const header = document.createElement('div');
    header.className = 'card-head';
    header.innerHTML = `
      <div>
        <div class="event-title-line">
          <span class="event-date">${formatDate(ev.date)}</span>
          ${categoryBadge(categories, ev.categoryId)}
        </div>
        <div class="event-meta">${[timeRange, locationHtml].filter(Boolean).join(' · ')}</div>
      </div>
    `;
    card.appendChild(header);

    if (ev.description) {
      const desc = document.createElement('div');
      desc.className = 'event-desc';
      desc.textContent = ev.description;
      card.appendChild(desc);
    }

    const rolesContainer = document.createElement('div');
    rolesContainer.style.marginTop = '16px';

    requiredRoles.forEach(roleId => {
      const roleLabel = STAFF_ROLES.find(r => r.id === roleId)?.label || roleId;
      const staffWithRole = persons.filter(p => personHasRole(p, roleId));
      const assignment = (staffAssignments[ev.id] || {})[roleId];

      const roleRow = document.createElement('div');
      roleRow.className = 'staff-role-row';
      roleRow.style.paddingBottom = '12px';
      roleRow.style.marginBottom = '12px';
      roleRow.style.borderBottom = '1px solid var(--line)';

      const roleTitle = document.createElement('div');
      roleTitle.className = 'staff-role-label';
      roleTitle.style.fontSize = '12px';
      roleTitle.style.textTransform = 'uppercase';
      roleTitle.style.letterSpacing = '0.08em';
      roleTitle.style.color = 'var(--ink-soft)';
      roleTitle.style.fontWeight = '700';
      roleTitle.style.marginBottom = '8px';
      roleTitle.textContent = roleLabel;
      roleRow.appendChild(roleTitle);

      const chipContainer = document.createElement('div');
      chipContainer.className = 'chip-row';

      // "None" option
      const noneChip = document.createElement('button');
      noneChip.type = 'button';
      noneChip.className = 'chip' + (assignment ? '' : ' active');
      noneChip.textContent = '— None —';
      noneChip.addEventListener('click', async () => {
        try {
          await api(`/api/staffAssignments/${ev.id}`, {
            method: 'PUT',
            body: JSON.stringify({ role: roleId, personId: null })
          });
          const res = await api('/api/state');
          staffAssignments = res.staffAssignments || {};
          renderStaffSection();
          flashSaved();
        } catch (e) {
          flashSaved('Could not save — retry');
        }
      });
      chipContainer.appendChild(noneChip);

      // Staff member options
      staffWithRole.forEach(staff => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip' + (assignment === staff.id ? ' active' : '');
        chip.textContent = escapeHtml(staff.name);
        chip.addEventListener('click', async () => {
          try {
            await api(`/api/staffAssignments/${ev.id}`, {
              method: 'PUT',
              body: JSON.stringify({ role: roleId, personId: staff.id })
            });
            const res = await api('/api/state');
            staffAssignments = res.staffAssignments || {};
            renderStaffSection();
            flashSaved();
          } catch (e) {
            flashSaved('Could not save — retry');
          }
        });
        chipContainer.appendChild(chip);
      });

      if (staffWithRole.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No staff members with this role available.';
        chipContainer.appendChild(empty);
      }

      roleRow.appendChild(chipContainer);
      rolesContainer.appendChild(roleRow);
    });

    card.appendChild(rolesContainer);
    section.appendChild(card);
  });
}

function flashSaved(msg) {
  const note = document.getElementById('savedNote');
  note.textContent = msg || 'Saved';
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(() => { note.textContent = ''; }, 1500);
}

loadAll();
</script>
</body>
</html>
