<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pandaplan · Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="nav">
  <a class="brand" href="/overview.html">🐼 pandaplan</a>
  <button class="hamburger" id="navToggle">☰</button>
  <div class="links" id="navLinks">
    <a href="/overview.html" class="current">Overview</a>
    <a href="/">Attend</a>
    <a href="/staff.html">Staff</a>
    <a href="/admin.html">Admin</a>
  </div>
</div>

<div class="wrap">
  <h1>Who's coming?</h1>
  <p class="sub">Overview of all events with attendance and staff assignments.</p>

  <div class="card">
    <h3>Category</h3>
    <div class="chip-row" id="categoryFilter" style="margin-bottom:16px;"></div>
    <h3>Date</h3>
    <div class="chip-row" id="dateFilter"></div>
  </div>

  <div id="overviewSection"></div>

  <div class="card">
    <button class="collapsible-button" id="syncToggle">📅 Sync to calendar</button>
    <div class="collapsible-content" id="subscribeCard"></div>
  </div>
</div>

<script src="/shared.js"></script>
<script>
let persons = [];
let categories = [];
let events = [];
let attendanceByPerson = {};
let staffAssignments = {};
let filters = { categoryIds: new Set(), dateMode: 'upcoming' };

async function loadAll() {
  const [state, attendanceRes] = await Promise.all([
    api('/api/state'),
    api('/api/attendance'),
  ]);
  persons = state.persons || [];
  categories = state.categories || [];
  events = state.events || [];
  attendanceByPerson = attendanceRes.attendance || {};
  staffAssignments = state.staffAssignments || {};

  renderFilters();
  renderOverview();
  renderSyncCard();
  setupCollapsible();
  setupMobileNav();
}

function setupCollapsible() {
  const toggle = document.getElementById('syncToggle');
  const content = document.getElementById('subscribeCard');
  toggle.addEventListener('click', () => {
    content.style.display = content.style.display === 'none' ? 'block' : 'none';
  });
  content.style.display = 'none';
}

function setupMobileNav() {
  const toggle = document.getElementById('navToggle');
  const links = document.getElementById('navLinks');
  toggle.addEventListener('click', () => {
    links.classList.toggle('mobile-open');
  });
  links.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      links.classList.remove('mobile-open');
    });
  });
}

function renderFilters() {
  renderCategoryFilterChips(document.getElementById('categoryFilter'), categories, filters.categoryIds, () => {
    renderFilters();
    renderOverview();
  });
  renderDateFilterChips(document.getElementById('dateFilter'), filters.dateMode, (mode) => {
    filters.dateMode = mode;
    renderFilters();
    renderOverview();
  });
}

function getAttendanceByStatus(eventId, status) {
  const result = [];
  persons.forEach(p => {
    if (p.roles && !p.roles.includes('participant')) return;
    const entry = attendanceByPerson[p.id] && attendanceByPerson[p.id][eventId];
    if (entry && entry.status === status) {
      result.push({ name: p.name, note: entry.note || '' });
    }
  });
  return result;
}

function renderOverview() {
  const section = document.getElementById('overviewSection');
  section.innerHTML = '';

  if (!events.length) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<div class="empty">No events yet — add some in Admin first.</div>';
    section.appendChild(card);
    return;
  }

  const filtered = sortByDateTime(filterEvents(events, filters));

  if (!filtered.length) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<div class="empty">No events match the current filters.</div>';
    section.appendChild(card);
    return;
  }

  filtered.forEach(ev => {
    const card = document.createElement('div');
    card.className = 'card roster-card';
    const timeRange = formatTimeRange(ev.startTime, ev.endTime);
    const cat = categoryById(categories, ev.categoryId);
    const staffLabels = cat ? staffRoleLabels(cat.requiredStaffRoles) : [];
    
    const yes = getAttendanceByStatus(ev.id, 'yes');
    const no = getAttendanceByStatus(ev.id, 'no');
    const maybe = getAttendanceByStatus(ev.id, 'maybe');
    
    const staffAssign = staffAssignments[ev.id] || {};
    const staffHtml = Object.entries(staffAssign)
      .map(([role, personId]) => {
        const person = persons.find(p => p.id === personId);
        return person ? `<span class="roster-name">${escapeHtml(role)}: ${escapeHtml(person.name)}</span>` : '';
      })
      .join('');
    
    const locationHtml = ev.location 
      ? `<a href="${formatMapsLink(ev.location)}" target="_blank" class="location-link">${escapeHtml(ev.location)}</a>`
      : '';

    card.innerHTML = `
      <div class="card-head">
        <div>
          <div class="event-title-line">
            <span class="event-date">${formatDate(ev.date)}</span>
            ${categoryBadge(categories, ev.categoryId)}
            ${staffLabels.length ? `<span class="staff-badge">Staff needed: ${escapeHtml(staffLabels.join(', '))}</span>` : ''}
          </div>
          <div class="event-meta">${[timeRange, locationHtml].filter(Boolean).join(' · ')}</div>
        </div>
      </div>
      ${ev.description ? `<div class="event-desc">${escapeHtml(ev.description)}</div>` : ''}
      ${yes.length ? `<div style="margin-top:12px;"><strong>Going (${yes.length}):</strong>
        <div class="roster-names">${yes.map(a => `<span class="roster-name">${escapeHtml(a.name)}${a.note ? `<span class="roster-note"> · ${escapeHtml(a.note)}</span>` : ''}</span>`).join('')}</div>
      </div>` : ''}
      ${maybe.length ? `<div style="margin-top:12px;"><strong>Maybe (${maybe.length}):</strong>
        <div class="roster-names">${maybe.map(a => `<span class="roster-name">${escapeHtml(a.name)}${a.note ? `<span class="roster-note"> · ${escapeHtml(a.note)}</span>` : ''}</span>`).join('')}</div>
      </div>` : ''}
      ${no.length ? `<div style="margin-top:12px;"><strong>Not going (${no.length}):</strong>
        <div class="roster-names">${no.map(a => `<span class="roster-name">${escapeHtml(a.name)}</span>`).join('')}</div>
      </div>` : ''}
      ${staffHtml ? `<div style="margin-top:12px;"><strong>Staff:</strong>
        <div class="roster-names">${staffHtml}</div>
      </div>` : ''}
    `;
    section.appendChild(card);
  });
}

function renderSyncCard() {
  const card = document.getElementById('subscribeCard');
  const url = window.location.origin + '/calendar/all.ics';
  renderSubscribeBox(card, url, 'Sync full schedule to calendar');
}

loadAll();
</script>
</body>
</html>
